services:
  db:
    image: postgres:18
    container_name: postgres__open-wearables
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-open-wearables}
      POSTGRES_USER: ${DB_USER:-open-wearables}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open-wearables -d open-wearables"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: themomentum/open-wearables-backend:0.10
    container_name: backend__open-wearables
    command: scripts/start/app.sh
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: themomentum/open-wearables-frontend:0.10
    container_name: frontend__open-wearables
    env_file:
      - ./.env
    ports:
      - "3001:3000"
    depends_on:
      - app
    restart: unless-stopped



  celery-worker:
    image: themomentum/open-wearables-backend:0.10
    container_name: celery-worker__open-wearables
    command: scripts/start/worker.sh
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
      - app
    restart: unless-stopped

  celery-beat:
    image: themomentum/open-wearables-backend:0.10
    container_name: celery-beat__open-wearables
    command: scripts/start/beat.sh
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
      - app
    restart: unless-stopped

  flower:
    image: themomentum/open-wearables-backend:0.10
    container_name: flower__open-wearables
    command: scripts/start/flower.sh
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
      - db
      - app
    restart: unless-stopped


  redis:
    image: redis:8
    container_name: redis__open-wearables
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped


  cloudflared-ow:
    image: cloudflare/cloudflared:latest
    container_name: ow_cloudflare_tunnel
    profiles: ["cloudflare-tunnel"]
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
      - frontend



